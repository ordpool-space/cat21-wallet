name: provision
description: Set up job with tasks needed to run a code check
inputs:
  PROVISION_MOBILE:
    description: 'Boolean value to identify if this is running on the main branch or not'
    required: false
  NODE_VERSION:
    description: 'Node.js major version to install'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      with:
        version: '10.33.0+sha512.10568bb4a6afb58c9eb3630da90cc9516417abebd3fabbe6739f0ae795728da1491e9db5a544c76ad8eb7570f5c4bb3d6c637b2cb41bfdcdb47fa823c8649319'

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org/'
        cache: 'pnpm'
        # The salt file lets us evict a poisoned pnpm store without
        # touching the lockfile. Incident: the d3cdfbcda run packed
        # ordpool-sdk into the store WITHOUT its prepare-built
        # dist-core/ (the provision still passed --ignore-scripts at
        # that commit); every same-lockfile run after restored that
        # half-baked entry and failed webpack with "Can't resolve
        # 'ordpool-sdk/core'…/wallet/signers". Bump the salt to force
        # a fresh store.
        cache-dependency-path: |
          pnpm-lock.yaml
          .github/pnpm-cache-salt

    # ordpool-sdk is consumed via a SHA-pinned github tarball
    # (apps/extension/package.json → "ordpool-sdk":
    # "github:ordpool-space/ordpool-sdk#<sha>"). Since SDK
    # 2026-07-17, dist-core/ (the `ordpool-sdk/core` entry the
    # extension imports) is NOT in git — the SDK's `prepare` script
    # generates it at install time. Reproducible per-commit.
    #
    # No `--ignore-scripts` here: pnpm 10 default-denies install
    # scripts for every dependency NOT in the root package.json's
    # `pnpm.onlyBuiltDependencies` allowlist (currently
    # better-sqlite3, ordpool-sdk, sqlite3). That per-package
    # allowlist is a strictly tighter gate than the old blanket
    # flag, and it lets the SDK's prepare hook run.

    - env:
        PROVISION_MOBILE: ${{ inputs.PROVISION_MOBILE }}
      shell: bash
      run: pnpm install

    # Fail HERE — not 30 minutes later inside webpack — if the SDK's
    # prepare hook didn't produce a complete dist-core/. Requiring
    # the module walks the full CommonJS graph, so any missing file
    # (e.g. wallet/signers/index.js from a half-prepared store entry)
    # throws with the exact unresolved path.
    - name: verify-ordpool-sdk-core
      shell: bash
      run: |
        node -e "require(require.resolve('ordpool-sdk/core', { paths: ['apps/extension'] })); console.log('ordpool-sdk/core OK — full require graph resolved')"

    - name: build-panda
      shell: bash
      run: pnpm turbo run build --filter="@leather.io/panda-preset"
