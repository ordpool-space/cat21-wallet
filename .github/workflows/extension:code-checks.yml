name: extension:code-checks

on:
  merge_group:
  push:
    branches:
      - '**'
    paths:
      - 'apps/extension/**'
      - 'packages/**'
      - '!packages/ui/**/*.native.ts'
      - '!packages/ui/**/*.native.tsx'

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unused-exports:
    name: lint-unused-exports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: lint-unused-typescript-exports
        working-directory: apps/extension
        run: pnpm lint:unused-exports

  # HACK -- Cat21: lint-firefox-build job disabled — Cat21 Wallet ships
  # Chrome-only (see CHROME-WEB-STORE-LISTING.md). Firefox is not on the
  # support matrix; the inherited Leather firefox build pulls in
  # upstream packages (@leather.io/query symbols we don't re-export)
  # and web-ext lint flags inherited innerHTML usage we don't touch.
  # Restore on the day we add a Firefox target.
