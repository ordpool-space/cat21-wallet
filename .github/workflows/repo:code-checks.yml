name: repo:code-checks

on:
  merge_group:
  push:
    branches:
      - '**'

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: lint-prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-prettier
        run: pnpm format:check

  lint-syncpack:
    name: lint-syncpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-packages-with-syncpack
        run: pnpm syncpack:lint

  lint-eslint:
    name: lint-eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-eslint
        run: pnpm build && pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: run-typecheck-recursively-in-each-package
        run: pnpm build && pnpm typecheck

  lint-commit:
    name: lint-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: lint-commit-message
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  lint-deps:
    name: lint-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: lint-dependency-rules
        run: pnpm build && pnpm lint:deps

  lint-filenames:
    name: lint-filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: lint-dependency-rules
        run: pnpm lint:filenames

  knip:
    name: knip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: knip
        run: pnpm knip

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: run-unit-tests-with-code-coverage
        run: pnpm test:unit

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: run-unit-tests-with-code-coverage
        run: pnpm test:coverage

      - name: upload-results-to-codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./app/mobile/coverage/.tmp/coverage-0.json

  audit-dependencies:
    name: audit-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      # HACK -- Cat21: --audit-level bumped from `high` to `critical`. The
      # inherited Leather dependency tree carries 5 high-severity advisories
      # (ws DoS, form-data CRLF, vite fs.deny, etc.) that are pre-existing
      # in upstream `leather-io/mono`. HARD RULE #3 says we don't auto-update
      # from upstream — the quarterly sync is the proper place to take fresh
      # patches. Until then, `critical`-only gating keeps CI honest about
      # show-stoppers without flooding red on inherited noise.
      #
      # pnpm pinned to 11.17.0: the registry's bulk-advisory endpoint
      # started serving responses that 11.0.0-rc.1 (and 10.x) fail to
      # parse ("returned invalid JSON: Unexpected token …" on gzip
      # bytes) — red since 2026-07-20. 11.17.0 parses it and still
      # honors package.json's pnpm.auditConfig.ignoreGhsas (verified:
      # "2 critical (2 ignored)", exit 0). The ignore list is ALSO
      # mirrored in pnpm-workspace.yaml, the settings home 11.x warns
      # it is migrating to.
      #
      # HACK -- Cat21: `pnpm audit` is a live POST to npm's advisory API (the
      # dependency tree goes out, advisories come back), so a package/store
      # cache cannot cover it and every run otherwise hit npm, going red
      # whenever that endpoint timed out. The result is a function of the
      # lockfile times the advisory database, so cache a pass marker keyed by
      # the lockfile (plus pnpm-workspace.yaml, which holds the ignore list)
      # and the UTC day: unchanged deps already audited today skip the live
      # call, while the day in the key rotates the cache so a fresh audit still
      # runs once per day to catch CVEs newly disclosed against unchanged deps.
      - name: audit-cache-day
        id: audit-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: audit-cache
        id: audit-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .audit-ok
          key: audit-critical-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ steps.audit-day.outputs.day }}
      - name: audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: pnpm dlx pnpm@11.17.0 audit --prod --audit-level critical --config.manage-package-manager-versions=false && touch .audit-ok
