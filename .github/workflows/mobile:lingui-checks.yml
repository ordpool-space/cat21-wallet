name: mobile:lingui-checks

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

# HACK -- Cat21: was auto-triggered upstream. Disabled in our fork: this workflow either pushes to leather-io destinations (npm, Chrome Web Store, deploy) or covers surface we do not ship (mobile, web). Manual trigger only.
on: workflow_dispatch


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lingui-extract:
    name: lingui-extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: run-lingui
        working-directory: ./apps/mobile
        run: |
          pnpm lingui:extract
          pnpm lingui:compile
          git diff --exit-code 'src/i18n/locales/**/messages.po' || (echo "Uncommited translations - messages.po changed!" && exit 1)
