name: repo:workflow-checks

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflow-names:
    name: validate-workflow-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: validate-workflow-naming-convention
        run: bash .github/scripts/validate-workflow-names.sh

  validate-job-names:
    name: validate-job-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: validate-job-naming-convention
        run: bash .github/scripts/validate-job-names.sh

  validate-step-names:
    name: validate-step-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: validate-step-naming-convention
        run: bash .github/scripts/validate-step-names.sh

  validate-filenames:
    name: validate-filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: validate-filename-matches-workflow-name
        run: bash .github/scripts/validate-filename-conventions.sh

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: install-actionlint
        id: get_actionlint
        run: bash .github/scripts/install-action-lint.sh

      - name: lint-github-workflows
        env:
          ACTIONLINT: ${{ steps.get_actionlint.outputs.executable }}
        run: |
          "$ACTIONLINT" -color

  audit-workflow-security:
    name: audit-workflow-security
    runs-on: ubuntu-latest
    # `contents: read` sufficient for zizmor to audit workflow files.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: zizmor-audit
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          persona: auditor
          # HACK -- Cat21: raised min-severity from `informational` to
          # `high`. The inherited Leather workflow tree + our trusted-build
          # carry a long tail of low/medium hints (hash-pin version-comment
          # drift, template-expansion notices in shell bodies, etc.) that
          # are mostly cosmetics. `high` keeps the high-signal advisories
          # (overly broad permissions, cache-poisoning, code injection)
          # gating CI without flooding red on noise.
          min-severity: high
          min-confidence: low
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
