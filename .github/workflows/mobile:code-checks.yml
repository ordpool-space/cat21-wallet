name: mobile:code-checks

# HACK -- Cat21: was auto-triggered upstream. Disabled in our fork: this workflow either pushes to leather-io destinations (npm, Chrome Web Store, deploy) or covers surface we do not ship (mobile, web). Manual trigger only.
on: workflow_dispatch


# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: knip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - run: pnpm build:packages

      - name: knip-unused-exports
        working-directory: apps/mobile
        run: pnpm knip
