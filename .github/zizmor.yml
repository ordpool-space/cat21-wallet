rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  secrets-outside-env:
    config:
      allow:
        - CODECOV_TOKEN
        - CLAUDE_CODE_OAUTH_TOKEN
        - SENTRY_AUTH_TOKEN
  # HACK -- Cat21: actions/setup-node is flagged for "enables caching by
  # default" even when no `cache:` key is set. The trusted-build workflow
  # already removed actions/cache and does NOT pass `cache:` to setup-node,
  # so there is no real cache-poisoning surface. Ignore the rule for that
  # specific file.
  cache-poisoning:
    ignore:
      - extension:trusted-build.yml
